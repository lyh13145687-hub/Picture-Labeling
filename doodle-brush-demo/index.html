<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>手机端涂鸦笔 Demo</title>
  <style>
    :root{--pink:#ff1768;--ink:#17171b;--muted:#999aa2;--sheet:#fff;--panel:rgba(0,0,0,.56)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101012;color:var(--ink)}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center}
    button,input{font:inherit}.app{--sheet-h:300px;--panel-h:100px;width:min(100vw,402px);height:min(100dvh,874px);position:relative;background:#000;box-shadow:0 0 48px rgba(0,0,0,.45);overflow:hidden}
    .photo-stage{position:absolute;inset:0 0 var(--sheet-h);background:#111;overflow:hidden}.photo-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
    .tool-row{position:absolute;left:16px;right:16px;bottom:calc(var(--panel-h) + 12px);display:flex;align-items:center;justify-content:space-between;pointer-events:none;transition:bottom .25s ease}.tool-cluster{display:flex;align-items:center;gap:8px;pointer-events:auto}
    .icon-btn{border:0;background:transparent;color:white;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:27px;line-height:1;cursor:pointer;text-shadow:0 2px 8px rgba(0,0,0,.55)}.icon-btn:disabled{opacity:.32}.undo-icon{font-size:33px;transform:translateY(-1px)}.redo-icon{font-size:33px;transform:scaleX(-1) translateY(-1px)}
    .mode-switch{height:46px;padding:4px;display:flex;gap:2px;background:rgba(22,22,24,.9);border-radius:24px;pointer-events:auto}.mode-switch button{width:38px;height:38px;border:0;background:transparent;border-radius:50%;color:#fff;font-size:19px;cursor:pointer}.mode-switch button.active{background:#fff;color:#1b1b1f}
    .settings-panel{height:100px;position:absolute;left:0;right:0;bottom:var(--sheet-h);background:rgba(0,0,0,.56);color:white;transition:height .25s ease;overflow:hidden;z-index:3}.settings-panel.expanded{height:218px}.settings-panel.expanded.no-hardness{height:170px}.slider-row{position:absolute;left:24px;right:64px;height:22px;display:grid;grid-template-columns:44px minmax(0,1fr) 32px;align-items:center;gap:8px;font-size:12px;line-height:1}.slider-row b{font-size:10px;font-weight:500;color:rgba(255,255,255,.76);text-align:right;font-variant-numeric:tabular-nums}.slider-row input{width:100%;min-width:0;height:18px;margin:0;accent-color:#fff}.hardness-row{bottom:170px}.opacity-row{bottom:122px}.smoothing-row{bottom:74px}.size-row{bottom:26px}.settings-panel:not(.expanded) .slider-row:not(.size-row){display:none}.settings-panel.expanded.no-hardness .hardness-row{display:none}
    .expand-btn{position:absolute;right:14px;bottom:23px;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.92);background:rgba(0,0,0,.16);color:white;font-size:18px;line-height:20px;cursor:pointer;z-index:2}.settings-panel.expanded .expand-btn{transform:rotate(180deg)}
    .logic-btn{display:none;position:absolute;right:14px;bottom:71px;width:42px;height:28px;border:1px solid rgba(255,255,255,.7);border-radius:14px;background:rgba(0,0,0,.2);color:white;font-size:9px;line-height:1;cursor:pointer;z-index:2}.settings-panel.expanded .logic-btn{display:block}
    .sheet{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);background:var(--sheet);border-radius:20px 20px 0 0;padding:0 12px 10px;display:flex;flex-direction:column;overflow:hidden;z-index:4}.sheet-top{height:58px;flex:0 0 58px;display:grid;grid-template-columns:44px 1fr 1fr 44px;align-items:center;border-bottom:1px solid #f1f1f3}.sheet-top button{border:0;background:none;color:#202126;font-size:27px}.tab-title{height:100%;display:grid;place-items:center;font-size:16px;font-weight:650;position:relative}.tab-title.active:after{content:"";position:absolute;width:24px;height:3px;border-radius:3px;background:var(--pink);bottom:6px}.tab-title.muted{color:#aaabb1;font-weight:500}
    .category-row{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:20px;white-space:nowrap;overflow:hidden;color:#8f9097;font-size:13px}.category-row .search{font-size:25px;color:#17171b}.category-row .active{color:#17171b;font-weight:600}
    .palette{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}.palette::-webkit-scrollbar{display:none}.swatch{flex:0 0 30px;width:30px;height:30px;border:0;border-radius:50%;background:var(--c);position:relative;cursor:pointer}.swatch.active:after{content:"✓";color:white;font-size:18px;position:absolute;inset:0;display:grid;place-items:center}.color-wheel{background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red)}.eyedropper{background:#e8e8eb;color:#222;font-size:15px;border:1px solid #c7c7cc}.native-color{position:absolute;opacity:0;pointer-events:none}
    .tip-selector{min-height:0;flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:65px;gap:8px;padding:7px 0 10px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}.tip-selector::-webkit-scrollbar{display:none}.tip-option{height:65px;border:0;background:#09090a;border-radius:12px;padding:6px;cursor:pointer;position:relative;overflow:hidden}.tip-option.active{box-shadow:inset 0 0 0 5px var(--pink)}.tip-option img,.default-preview{width:100%;height:100%;object-fit:contain}.default-preview{display:grid;place-items:center}.default-preview i{width:45px;height:45px;border-radius:50%;background:#fff}.tip-option span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);padding:9px 14px;border-radius:18px;background:rgba(25,25,28,.9);color:white;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    [hidden]{display:none!important}.dialog-backdrop{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:28px}.dialog{width:min(100%,286px);border-radius:18px;background:#fff;overflow:hidden;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.28)}.dialog-copy{padding:24px 20px 20px}.dialog-copy strong{display:block;font-size:17px;margin-bottom:8px}.dialog-copy p{margin:0;color:#777981;font-size:13px;line-height:1.5}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ececef}.dialog-actions button{height:48px;border:0;background:#fff;font-size:15px;color:#55575e}.dialog-actions button+button{border-left:1px solid #ececef;color:var(--pink);font-weight:650}
    @media(min-width:700px){.app{border-radius:28px}}
  </style>
</head>
<body>
<div class="app">
  <section class="photo-stage">
    <canvas id="tailSafe" aria-label="可缩放涂鸦画布"></canvas>
    <div class="tool-row">
      <div class="tool-cluster"><button class="icon-btn undo-icon" id="undo" aria-label="撤销">↶</button><button class="icon-btn redo-icon" id="redo" aria-label="重做">↶</button></div>
      <div class="mode-switch"><button id="brushTool" class="active" aria-label="画笔">✎</button><button id="eraserTool" aria-label="橡皮">▱</button></div>
    </div>
  </section>
  <section class="settings-panel" id="settingsPanel">
    <button class="expand-btn" id="expandPanel" aria-label="展开参数">⌃</button>
    <button class="logic-btn" id="logicToggle" aria-label="切换平滑逻辑">逻辑2</button>
    <label class="slider-row hardness-row" id="hardnessControl"><span>硬度</span><input id="hardness" type="range" min="0" max="100" value="100"><b><span id="hardnessText">100</span>%</b></label>
    <label class="slider-row opacity-row"><span>透明度</span><input id="opacity" type="range" min="5" max="100" value="100"><b><span id="opacityText">100</span>%</b></label>
    <label class="slider-row smoothing-row"><span>平滑</span><input id="smoothing" type="range" min="1" max="100" value="45"><b><span id="smoothingText">45</span>%</b></label>
    <label class="slider-row size-row"><span>尺寸</span><input id="size" type="range" min="1" max="180" value="86"><b><span id="sizeText">86</span></b></label>
  </section>
  <section class="sheet">
    <div class="sheet-top"><button id="clearButton" aria-label="清空画布">×</button><div class="tab-title active">手动绘制</div><div class="tab-title muted">一键涂鸦</div><button aria-label="完成">✓</button></div>
    <div class="category-row"><span class="search">⌕</span><span class="active">最近</span><span>热门</span><span>VIP</span><span>画笔</span><span>IP</span><span>妆发</span><span>亮晶晶</span><span>文字</span></div>
    <div class="palette" id="palette">
      <button class="swatch color-wheel" id="colorWheel" aria-label="色板"></button><input class="native-color" id="color" type="color" value="#ff1768">
      <button class="swatch eyedropper" aria-label="吸管">⌾</button>
      <button class="swatch" style="--c:#111" data-color="#111111"></button><button class="swatch" style="--c:#b8b8ba" data-color="#b8b8ba"></button><button class="swatch" style="--c:#ef75bd" data-color="#ef75bd"></button><button class="swatch" style="--c:#f23ca1" data-color="#f23ca1"></button><button class="swatch active" style="--c:#ff1768" data-color="#ff1768"></button><button class="swatch" style="--c:#ff858b" data-color="#ff858b"></button><button class="swatch" style="--c:#ff525c" data-color="#ff525c"></button><button class="swatch" style="--c:#ff1017" data-color="#ff1017"></button>
    </div>
    <div class="tip-selector" id="tipSelector">
      <button class="tip-option active" data-tip="default"><div class="default-preview"><i id="defaultPreviewDot"></i></div><span>默认画笔</span></button>
      <button class="tip-option" data-tip="round"><img data-asset="head1" alt="上下圆弧"><span>上下圆弧</span></button>
      <button class="tip-option" data-tip="square"><img data-asset="head2" alt="上下平直"><span>上下平直</span></button>
      <button class="tip-option" data-tip="soft"><img data-asset="head3" alt="撕纸"><span>撕纸</span></button>
      <button class="tip-option" data-tip="flat"><img data-asset="head4" alt="平头纸胶带"><span>平头纸胶带</span></button>
      <button class="tip-option" data-tip="feather"><img data-asset="head5" alt="边缘羽化"><span>边缘羽化</span></button>
    </div>
  </section>
  <div class="dialog-backdrop" id="clearDialog" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="clearTitle"><div class="dialog-copy"><strong id="clearTitle">清空全部涂鸦？</strong><p>清空后将移除画布上的全部笔迹，此操作无法撤销。</p></div><div class="dialog-actions"><button id="cancelClear">取消</button><button id="confirmClear">确认清空</button></div></div></div>
</div><div class="toast" id="toast"></div>

  function undoLast(){const last=state.strokes.at(-1);if(!last)return;if(last.shapeLocked&&last.rawPoints){state.redoStack.push({kind:'shape',index:state.strokes.length-1,stroke:cloneStroke(last)});last.points=last.rawPoints.map(p=>({...p}));last.shapeLocked=false;last.shapeLabel=null;last.shapeKind=null;last.shapeBounds=null;last.shapeHandle=null}else state.redoStack.push({kind:'stroke',stroke:cloneStroke(state.strokes.pop())});rebuildLayers()}
  function redoLast(){const entry=state.redoStack.pop();if(!entry)return;if(entry.kind==='shape')state.strokes[entry.index]=cloneStroke(entry.stroke);else state.strokes.push(cloneStroke(entry.stroke));rebuildLayers()}
  function updateHistoryUI(){document.querySelector('#undo').disabled=!state.strokes.length;document.querySelector('#redo').disabled=!state.redoStack.length}
  document.querySelector('#undo').addEventListener('click',undoLast);
  document.querySelector('#redo').addEventListener('click',redoLast);
  function setTool(tool){state.tool=tool;document.querySelector('#brushTool').classList.toggle('active',tool==='brush');document.querySelector('#eraserTool').classList.toggle('active',tool==='erase');document.querySelector('#settingsPanel').classList.toggle('no-hardness',tool==='brush'&&state.tip!=='default');syncPanelLayout()}
  document.querySelector('#brushTool').addEventListener('click',()=>setTool('brush'));document.querySelector('#eraserTool').addEventListener('click',()=>setTool('erase'));
  const clearDialog=document.querySelector('#clearDialog');
  function closeClearDialog(){clearDialog.hidden=true}
  document.querySelector('#clearButton').addEventListener('click',()=>{clearDialog.hidden=false;document.querySelector('#cancelClear').focus()});
  document.querySelector('#cancelClear').addEventListener('click',closeClearDialog);
  document.querySelector('#confirmClear').addEventListener('click',()=>{state.strokes=[];state.redoStack=[];state.active=null;closeClearDialog();rebuildLayers()});
  clearDialog.addEventListener('click',e=>{if(e.target===clearDialog)closeClearDialog()});
  function syncPanelLayout(){const panel=document.querySelector('#settingsPanel'),expanded=panel.classList.contains('expanded'),height=expanded?(panel.classList.contains('no-hardness')?170:218):100;document.querySelector('.app').style.setProperty('--panel-h',height+'px')}
  document.querySelector('#expandPanel').addEventListener('click',()=>{document.querySelector('#settingsPanel').classList.toggle('expanded');syncPanelLayout()});
  document.querySelector('#colorWheel').addEventListener('click',()=>document.querySelector('#color').click());
  function setColor(color){state.color=color;document.querySelector('#color').value=color;document.querySelectorAll('[data-color]').forEach(s=>s.classList.toggle('active',s.dataset.color.toLowerCase()===color.toLowerCase()));setTool('brush')}
  document.querySelector('#palette').addEventListener('click',e=>{const swatch=e.target.closest('[data-color]');if(swatch)setColor(swatch.dataset.color)});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!clearDialog.hidden){closeClearDialog();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redoLast():undoLast()}});
  new ResizeObserver(resize).observe(document.querySelector('.photo-stage'));

  updateDefaultPreview();syncPanelLayout();drawBackground();state.strokes=[];updateHistoryUI();drawAll();
  Promise.all(urls.map(loadImage)).then(imgs=>{
    const headKeys=['round','square','soft','flat','feather'];headKeys.forEach((key,i)=>{headMasks[key]=makeLuminanceMask(imgs[i]);headCoverage[key]=alphaToCoverage(headMasks[key]);centerProfiles[key]=extractCenterProfile(headMasks[key])});
    stars=imgs.slice(5);rebuildLayers();
  }).catch(err=>{
    console.error('内嵌素材载入失败，请重新打开此 HTML 文件。',err);
  });
  loadImage(embeddedAssets.canvasPhoto).then(img=>{canvasPhoto=img;drawBackground();drawAll()}).catch(err=>console.error('画布图片载入失败',err));
})();
</script>
</body>
</html>
